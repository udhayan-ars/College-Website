<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Canteen Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <h1>🎓 Smart Campus Canteen</h1>
            <p>Fresh & Hygienic Food for Students & Faculty</p>
        </div>
        <div class="role-selector">
            <label for="userRole">Ordering as:</label>
            <select id="userRole">
                <option value="Student">👨‍🎓 Student</option>
                <option value="Faculty">👩‍🏫 Faculty</option>
                <option value="Guest">👤 Guest</option>
            </select>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Meal Time Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="filterMenu('Morning', this)">🌅 Morning Breakfast</button>
            <button class="tab-btn" onclick="filterMenu('Afternoon', this)">☀️ Afternoon Meals</button>
            <button class="tab-btn" onclick="filterMenu('Evening', this)">🌙 Evening Snacks</button>
            <button class="tab-btn" onclick="filterMenu('All', this)">🍽️ All Items</button>
        </div>

        <div class="main-layout">
            <!-- Left Side: Food Menu Grid -->
            <div class="menu-section">
                <h2 id="menuTitle">🌅 Morning Breakfast Menu</h2>
                <div id="foodGrid" class="food-grid">
                    <!-- Food cards will be generated by JavaScript -->
                </div>
            </div>

            <!-- Right Side: Live Cart & Checkout -->
            <div class="cart-section">
                <h2>🛒 Your Order Cart</h2>
                <div id="cartItems" class="cart-items">
                    <p class="empty-msg">Your cart is empty. Add items from the menu!</p>
                </div>

                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Total Items:</span>
                        <span id="totalQty">0</span>
                    </div>
                    <div class="summary-row total-price">
                        <span>Grand Total:</span>
                        <span id="grandTotal">₹0</span>
                    </div>

                    <div class="payment-box">
                        <label>Payment Method:</label>
                        <select id="paymentMethod">
                            <option value="Cash on Counter">💵 Cash on Counter</option>
                            <option value="UPI / QR Scan">📱 UPI / QR Scan</option>
                            <option value="College ID Card">💳 College ID Wallet</option>
                        </select>
                    </div>

                    <button class="order-btn" onclick="placeOrder()">Place Order Now</button>
                </div>
            </div>
        </div>

        <!-- Order History Section -->
        <div class="history-section">
            <h2>📋 Live Order Tokens & History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Token No</th>
                        <th>Role</th>
                        <th>Items Ordered</th>
                        <th>Total Paid</th>
                        <th>Payment</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="orderHistoryBody">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #777;">No orders placed yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
