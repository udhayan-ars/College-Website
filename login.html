
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusTrack | Login</title>

    <link rel="stylesheet" href="login.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <span>🚌</span>
                <h1>CampusTrack</h1>
                <p>SMART COLLEGE TRANSPORT MANAGEMENT</p>
            </div>

            <div class="welcome">
                <h2>Welcome Back!</h2>
                <p>Login to continue to your account</p>
            </div>

            <form id="loginForm">

                <label>Select Account Type</label>

                <div class="role-selection">

                    <button type="button"
                        class="role-btn active"
                        data-role="student">
                        🎓 Student
                    </button>

                    <button type="button"
                        class="role-btn"
                        data-role="admin">
                        🛡️ Admin
                    </button>

                    <button type="button"
                        class="role-btn"
                        data-role="driver">
                        🚌 Driver
                    </button>

                </div>

                <input type="hidden"
                    id="selectedRole"
                    value="student">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="forgot-password">
                    <a href="#" id="forgotPassword">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit" id="loginButton">
                    Login to CampusTrack
                </button>

                <p id="message"></p>

            </form>

            <div class="login-footer">
                <p>CampusTrack © 2026</p>
                <p>College Transport Management System</p>
            </div>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
