
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Management Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="rolePage">
    <h1>College Management Portal</h1>
    <p class="subtitle">Welcome! Please select your login type</p>

    <div class="roles">
        <div class="role-card" onclick="selectRole('Student')">
            <div class="emoji">🎓</div>
            <h2>Student</h2>
            <p>Access your academic services</p>
            <button>Student Login</button>
        </div>

        <div class="role-card" onclick="selectRole('Faculty')">
            <div class="emoji">👨‍🏫</div>
            <h2>Faculty</h2>
            <p>Manage academic activities</p>
            <button>Faculty Login</button>
        </div>

        <div class="role-card" onclick="selectRole('Admin')">
            <div class="emoji">🛡️</div>
            <h2>Admin</h2>
            <p>Manage the college portal</p>
            <button>Admin Login</button>
        </div>
    </div>
</div>

<div class="login-box hidden" id="loginPage">
    <h1 id="loginTitle">Login</h1>
    <p>Enter your login details</p>

    <form onsubmit="login(event)">
        <input type="text" id="userId" placeholder="User ID" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <button class="back" onclick="goBack()">← Back</button>
    <p id="loginMessage"></p>
</div>

<div class="dashboard hidden" id="dashboard">
    <header>
        <h2>College Management Portal</h2>
        <button onclick="logout()">Logout</button>
    </header>

    <div class="welcome">
        <h1 id="welcomeTitle"></h1>
        <p id="welcomeText"></p>
    </div>

    <h2>Available Services</h2>
    <div class="services" id="serviceList"></div>
</div>

<script src="script.js"></script>
</body>
</html>
